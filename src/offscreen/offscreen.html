<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>GazePause — offscreen</title>
  </head>
  <body>
    <!--
      このページはユーザーには表示されない(chrome.offscreenで裏方として起動される)。
      videoタグはMediaPipeへ渡すカメラ映像を保持するためだけに存在し、
      画面に見せる必要が無いので描画用のcanvasやスタイルは持たない。
    -->
    <video id="camera-source" autoplay playsinline muted></video>
    <script type="module" src="/src/offscreen/offscreen.ts"></script>
  </body>
</html>
