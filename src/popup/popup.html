<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaze-Aware Playback</title>
    <style>
      /* 拡張機能アイコンをクリックしたときに開く小さいウィンドウなので、
         あまり大きくしすぎない(幅280px程度が一般的なpopupのサイズ感)。 */
      body {
        width: 280px;
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #status {
        font-size: 13px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Gaze-Aware Playback</h1>
    <p id="status">確認中...</p>
    <button id="open-options-button" type="button">設定ページを開く</button>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
